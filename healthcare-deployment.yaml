apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthcare-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: healthcare-portal
  template:
    metadata:
      labels:
        app: healthcare-portal
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
      - name: portal
        image: healthcare-portal:secure
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: healthcare-portal-service
spec:
  type: NodePort
  selector:
    app: healthcare-portal
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30082
